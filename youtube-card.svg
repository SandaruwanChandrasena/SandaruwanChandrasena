<svg width="380" height="230" viewBox="0 0 380 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Teal border gradient (same colors as the header) -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#134e5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft background glow -->
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#134e5e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <style>
      .title { font: 700 19px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .handle { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2dd4bf; }
      .sub { font: 400 12.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
      .btn-text { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }

      /* Play icon gently pulses */
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 190px 58px; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      /* Card fades in */
      .fade { animation: fade 0.9s ease-out both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <g class="fade">
    <!-- Card background with gradient border -->
    <rect x="1.5" y="1.5" width="377" height="227" rx="16" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
    <rect x="1.5" y="1.5" width="377" height="227" rx="16" fill="url(#glow)"/>

    <!-- YouTube play logo -->
    <g class="pulse">
      <rect x="160" y="38" width="60" height="42" rx="11" fill="#ff0000"/>
      <polygon points="183,48 183,70 201,59" fill="#ffffff"/>
    </g>

    <!-- Text -->
    <text x="190" y="112" text-anchor="middle" class="title">My YouTube Channel</text>
    <text x="190" y="135" text-anchor="middle" class="handle">@SandaruwanChandrasena-98</text>
    <text x="190" y="155" text-anchor="middle" class="sub">Coding projects explained step by step</text>

    <!-- Watch button -->
    <rect x="120" y="172" width="140" height="36" rx="18" fill="#ff0000"/>
    <polygon points="135,183 135,197 147,190" fill="#ffffff"/>
    <text x="203" y="195" text-anchor="middle" class="btn-text">WATCH NOW</text>
  </g>
</svg>
